[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "returnproof"
version = "0.1.0"
description = "Evidence-backed returns, product-identity verification and financial-recovery operations for Indian e-commerce sellers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Nishant Tyagi"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "pillow>=10.4",
    "imagehash>=4.3",
    "reportlab>=4.2",
    "python-dateutil>=2.9",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["returnproof*"]

[tool.setuptools.package-data]
returnproof = ["templates/**/*.html", "static/**/*", "data/**/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["returnproof", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = [".venv", "alembic/versions"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["imagehash.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: slower end-to-end tests"]

[tool.coverage.run]
source = ["returnproof"]
omit = ["returnproof/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
skip_covered = true
